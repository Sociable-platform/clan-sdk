# __SDK_VERSION__ is replaced from package.json during the Node build stage.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;
    types { application/javascript js; }

    location /v1/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location /__SDK_VERSION__/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # This is an SDK asset server, with no SPA fallback or service proxy.
    location / {
        return 404;
    }
}
